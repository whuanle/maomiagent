name: desktop-release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  MAOMI_RELEASE_APP_CODE: maomiagent
  MAOMI_RELEASE_CHANNEL: stable
  MAOMI_DESKTOP_ARTIFACT_FOLDER: artifacts
  MAOMI_DESKTOP_UPDATE_BASE_URL: ${{ vars.MAOMI_DESKTOP_UPDATE_BASE_URL }}
  MAOMI_RELEASE_ADMIN_BASE_URL: ${{ vars.MAOMI_RELEASE_ADMIN_BASE_URL }}
  MAOMI_DESKTOP_PUBLIC_SOFTWARE_BASE_URL: ${{ vars.MAOMI_DESKTOP_PUBLIC_SOFTWARE_BASE_URL }}
  MAOMI_RELEASE_UPLOAD_REQUEST_URL: ${{ vars.MAOMI_RELEASE_UPLOAD_REQUEST_URL }}
  MAOMI_RELEASE_UPLOAD_COMPLETE_URL: ${{ vars.MAOMI_RELEASE_UPLOAD_COMPLETE_URL }}
  MAOMI_RELEASE_ADMIN_RELEASES_URL: ${{ vars.MAOMI_RELEASE_ADMIN_RELEASES_URL }}
  MAOMI_RELEASE_AUTO_PUBLISH: ${{ vars.MAOMI_RELEASE_AUTO_PUBLISH || 'false' }}
  MAOMI_RELEASE_UPLOAD_AUTH_HEADER: ${{ vars.MAOMI_RELEASE_UPLOAD_AUTH_HEADER }}
  MAOMI_RELEASE_UPLOAD_AUTH_TOKEN: ${{ secrets.MAOMI_RELEASE_UPLOAD_AUTH_TOKEN }}
  MAOMI_RELEASE_ADMIN_AUTH_HEADER: ${{ vars.MAOMI_RELEASE_ADMIN_AUTH_HEADER }}
  MAOMI_RELEASE_ADMIN_AUTH_TOKEN: ${{ secrets.MAOMI_RELEASE_ADMIN_AUTH_TOKEN }}

jobs:
  build-windows-x64:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Install desktop dependencies
        run: bun install --cwd apps/desktop/MaomiAgent

      - name: Verify root legacy guards
        run: bun run verify

      - name: Resolve release metadata
        id: release
        shell: pwsh
        run: |
          $refName = "${{ github.ref_name }}"
          $version = $refName -replace '^[vV]', ''
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw "Failed to resolve release version from ref name: $refName"
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Build desktop release artifacts
        env:
          MAOMI_DESKTOP_VERSION: ${{ steps.release.outputs.version }}
          MAOMI_RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: bun run release:build

      - name: Generate desktop release manifest
        env:
          MAOMI_DESKTOP_VERSION: ${{ steps.release.outputs.version }}
          MAOMI_RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: bun run release:manifest

      - name: Upload desktop release artifacts to object storage
        if: env.MAOMI_RELEASE_UPLOAD_AUTH_TOKEN != ''
        env:
          MAOMI_DESKTOP_VERSION: ${{ steps.release.outputs.version }}
          MAOMI_RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: bun run release:upload

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: MaomiAgent-release-v${{ steps.release.outputs.version }}-windows-x64
          path: apps/desktop/MaomiAgent/artifacts/*

      - name: Publish GitHub Release asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: apps/desktop/MaomiAgent/artifacts/*