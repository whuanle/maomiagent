name: desktop-release

on:
  workflow_dispatch:
  push:
    tags:
      - "*"

permissions:
  contents: write

env:
  MAOMI_DESKTOP_ARTIFACT_FOLDER: artifacts

jobs:
  prepare-release:
    runs-on: ubuntu-24.04
    outputs:
      should_publish: ${{ steps.release.outputs.should_publish }}
      version: ${{ steps.release.outputs.version }}
      npm_version: ${{ steps.release.outputs.npm_version }}
      channel: ${{ steps.release.outputs.channel }}
      is_prerelease: ${{ steps.release.outputs.is_prerelease }}
      tag_name: ${{ steps.release.outputs.tag_name }}

    steps:
      - name: Resolve release metadata
        id: release
        shell: pwsh
        run: |
          $refName = "${{ github.ref_name }}".Trim()
          if ($refName -match '^[vV]?(?<major>\d+)\.(?<minor>\d+)\.(?<patch>\d+)(?:\.(?<build>\d+))?(?<preview>_preview)?$') {
            $build = if ($Matches.build) { $Matches.build } else { '0' }
            $preview = if ($Matches.preview) { '_preview' } else { '' }
            $channel = if ($Matches.preview) { 'preview' } else { 'stable' }
            $isPrerelease = if ($Matches.preview) { 'true' } else { 'false' }
            $version = "$($Matches.major).$($Matches.minor).$($Matches.patch).$build$preview"
            $npmVersion = if ($Matches.preview) {
              "$($Matches.major).$($Matches.minor).$($Matches.patch)-preview.$build"
            } elseif ($Matches.build) {
              "$($Matches.major).$($Matches.minor).$($Matches.patch)-build.$build"
            } else {
              "$($Matches.major).$($Matches.minor).$($Matches.patch)"
            }
            "should_publish=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            "npm_version=$npmVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            "channel=$channel" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            "is_prerelease=$isPrerelease" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            "tag_name=$refName" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          } else {
            Write-Host "Ignoring ref '$refName' because it does not match the desktop release version format."
            "should_publish=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            "version=" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            "npm_version=" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            "channel=stable" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            "is_prerelease=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            "tag_name=$refName" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          }

  build:
    if: needs.prepare-release.outputs.should_publish == 'true'
    needs: prepare-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            target: win-x64
          - runner: ubuntu-24.04
            target: linux-x64
          - runner: macos-15
            target: macos-arm64
          - runner: macos-15-intel
            target: macos-x64
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Install desktop dependencies
        run: bun install --cwd apps/desktop/MaomiAgent

      - name: Verify root legacy guards
        run: bun run verify

      - name: Build desktop release artifacts
        env:
          MAOMI_DESKTOP_VERSION: ${{ needs.prepare-release.outputs.version }}
          MAOMI_RELEASE_VERSION: ${{ needs.prepare-release.outputs.version }}
          MAOMI_RELEASE_CHANNEL: ${{ needs.prepare-release.outputs.channel }}
          MAOMI_DESKTOP_GITHUB_OWNER: ${{ github.repository_owner }}
          MAOMI_DESKTOP_GITHUB_REPO: ${{ github.event.repository.name }}
        run: bun run release:build

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: MaomiAgent-release-${{ matrix.target }}
          path: apps/desktop/MaomiAgent/artifacts/**/*

  publish-release:
    if: needs.prepare-release.outputs.should_publish == 'true'
    needs:
      - prepare-release
      - build
    runs-on: ubuntu-24.04

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: MaomiAgent-release-*
          merge-multiple: true
          path: release-assets

      - name: Remove existing release assets for tag
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $headers = @{
            Accept = "application/vnd.github+json"
            Authorization = "Bearer $env:GITHUB_TOKEN"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $releaseUrl = "https://api.github.com/repos/${{ github.repository }}/releases/tags/${{ needs.prepare-release.outputs.tag_name }}"

          try {
            $release = Invoke-RestMethod -Headers $headers -Uri $releaseUrl
          } catch {
            $statusCode = if ($_.Exception.Response) { $_.Exception.Response.StatusCode.value__ } else { 0 }
            if ($statusCode -eq 404) {
              Write-Host "No existing release found for ${{ needs.prepare-release.outputs.tag_name }}."
              exit 0
            }
            throw
          }

          foreach ($asset in @($release.assets)) {
            Write-Host "Deleting existing release asset $($asset.name)"
            Invoke-RestMethod -Headers $headers -Method Delete -Uri "https://api.github.com/repos/${{ github.repository }}/releases/assets/$($asset.id)"
          }

      - name: Publish GitHub Release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare-release.outputs.tag_name }}
          generate_release_notes: true
          prerelease: ${{ needs.prepare-release.outputs.is_prerelease == 'true' }}
          files: release-assets/release/*

  publish-npm:
    if: needs.prepare-release.outputs.should_publish == 'true'
    needs:
      - prepare-release
      - build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Upgrade npm CLI for trusted publishing
        run: npm install --global npm@11.16.0

      - name: Download npm artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: MaomiAgent-release-*
          merge-multiple: true
          path: release-assets

      - name: Install npm package dependencies
        run: npm install --prefix ./packages/maomiagent-npm --ignore-scripts

      - name: Assemble npm package
        env:
          MAOMI_AGENT_NPM_ARTIFACT_ROOT: ${{ github.workspace }}/release-assets/npm
          MAOMI_AGENT_NPM_VERSION: ${{ needs.prepare-release.outputs.npm_version }}
        run: node scripts/assemble-maomiagent-npm-package.mjs

      - name: Publish npm package
        run: npm publish ./packages/maomiagent-npm --access public
